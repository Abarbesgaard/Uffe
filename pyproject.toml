[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "uffe"
version = "0.1.0"
description = "Read-only Kubernetes observation and evidence handoff to your herdr agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.3.3",
    "textual>=6,<9",
]

[project.scripts]
uffe = "uffe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "build>=1.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mutmut]
source_paths = ["src/uffe/"]
pytest_add_cli_args_test_selection = ["tests/"]
