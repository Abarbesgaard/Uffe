name: Security audit

# Flags locked dependencies with known advisories (PyPA / OSV) once a day, to
# catch newly published advisories against the versions we already depend on.
# PRs and pushes that change pyproject.toml/uv.lock are audited by the
# "Dependency audit" stage in ci.yml. Findings open (or update) an issue.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Run pip-audit
        id: audit
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt > requirements.txt
          if uvx pip-audit==2.10.1 -r requirements.txt --disable-pip --no-deps --strict \
               --format markdown --desc on > report.md; then
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          fi
          cat report.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open or update the audit issue
        if: steps.audit.outputs.vulnerable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Security audit: vulnerable dependencies"
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file report.md
          fi
          exit 1
